[project]
name = "overlaparr"
version = "0.1.1"
description = "Find Sonarr/Radarr media already available on other Plex servers"
readme = "README.md"
authors = [
    { name = "Rudhra Raveendran", email = "5439867+ROODAY@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "apprise>=2.1.0",
    "apscheduler<4",
    "bcrypt>=5.0.0",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "plexapi>=4.18.3",
    "pydantic>=2.14.1",
    "ruamel-yaml>=0.19.1",
    "sqlalchemy>=2.1.6",
    "uvicorn[standard]>=0.54.0",
    "watchfiles>=1.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "freezegun>=1.5.5",
    "pytest>=9.1.1",
    "respx>=0.23.1",
]

[tool.hatch.build.targets.wheel]
packages = ["overlaparr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
